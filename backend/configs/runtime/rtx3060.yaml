profile: rtx3060

runtime:
  device: cuda:0
  precision: fp16

analysis:
  target_fps: 18.0
  minimum_fps: 12.0
  queue_size: 1
  drop_stale_frames: true

detector:
  model: /models/detection/yolo11n.pt
  imgsz: 640
  conf: 0.10
  iou: 0.50
  classes: [0]
  max_det: 32
  half: true

tracker:
  config: /app/configs/tracking/bytetrack_exam_3060.yaml

diagnostics:
  publish_hz: 2

tracking_debug:
  enabled: false
  log_every_n_frames: 10
  suspicious_iou_threshold: 0.50

ui:
  tracking_interpolation: false
  tracking_smoothing: false
