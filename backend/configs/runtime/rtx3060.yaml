profile: rtx3060

runtime:
  device: cuda:0
  precision: fp16

analysis:
  target_fps: 18.0
  minimum_fps: 12.0
  queue_size: 1
  drop_stale_frames: true

detector:
  model: /models/detection/yolo11n.pt
  imgsz: 640
  conf: 0.10
  iou: 0.50
  classes: [0]
  max_det: 32
  half: true
  duplicate_suppression:
    enabled: true
    containment_threshold: 0.90
    max_area_ratio: 0.70
    max_center_distance_ratio: 0.35
    preferred_detection_confidence: 0.25
    larger_box_min_confidence_ratio: 0.65

tracker:
  config: /app/configs/tracking/bytetrack_exam_3060.yaml

diagnostics:
  publish_hz: 2

seat_assignment:
  enabled: true
  overlap_weight: 0.70
  distance_weight: 0.30
  min_score: 0.35
  seat_expand_ratio: 0.08
  confirm_ms: 600
  release_ms: 1500
  switch_margin: 0.15
  switch_confirm_ms: 800

action_recognition:
  enabled: false  # RTX3060 scheduling/precision remains unbenchmarked
  model: /models/action/r3/model.pth
  checkpoint_sha256: c5ef406cfe404d2883575d8dcf1306fd7bebc6d6b1ec723b5093f2a3e09b357c
  architecture: TSM-ResNet50
  num_segments: 8
  input_size: 224
  clip_span_ms: 4000
  capture_interval_ms: 160
  sample_tolerance_ms: 140
  max_gap_ms: 750
  precision: fp16
  scheduling:
    prediction_stride_ms: 1000
    max_batch_size: 4
    max_queue_size: 1
    max_prediction_age_ms: 2000
    min_inference_interval_ms: 160
  single_roi:
    expand_x: 0.04
    expand_top: 0.03
    expand_bottom: 0.08
    min_crop_width_px: 128
    min_crop_height_px: 128
  pair_roi:
    expand_x: 0.025
    expand_top: 0.02
    expand_bottom: 0.06
    min_crop_width_px: 128
    min_crop_height_px: 128
  adjacency:
    row_tolerance_ratio: 0.75
    max_horizontal_gap_ratio: 2.5

tracking_debug:
  enabled: false
  log_every_n_frames: 10
  suspicious_iou_threshold: 0.50

ui:
  tracking_interpolation: false
  tracking_smoothing: false
